<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agenda Game Club</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Audiowide&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --bg: #14161B;
    --surface: #1D2027;
    --surface-2: #262A33;
    --text: #F3F1EA;
    --muted: #ACB0BC;
    --border: rgba(255,255,255,0.14);
    --amber: #F2B705;
    --amber-ink: #1A1400;
    --coral: #FF7A57;
    --teal: #5FD1BC;
    --violet: #D79BFF;
  }

  * { box-sizing: border-box; }

  html { color-scheme: dark; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Work Sans', sans-serif;
    line-height: 1.5;
  }

  h1, h2, h3 { font-family: 'Anton', sans-serif; font-weight: 400; margin: 0; letter-spacing: 0.01em; }
  .mono { font-family: 'Space Mono', monospace; }

  /* Accessibility utilities */
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
  .skip-link {
    position: absolute; left: 8px; top: -60px; background: var(--amber); color: var(--amber-ink);
    padding: 10px 16px; border-radius: 8px; font-weight: 600; z-index: 100; transition: top .15s ease;
  }
  .skip-link:focus { top: 8px; }

  :focus-visible {
    outline: 3px solid var(--amber);
    outline-offset: 2px;
    border-radius: 4px;
  }

  button { font-family: inherit; cursor: pointer; }
  input, textarea, select { font-family: inherit; font-size: 1rem; }

  /* Layout */
  .site-header { padding: 32px 20px 0; max-width: 1180px; margin: 0 auto; }
  @media (min-width: 640px) { .site-header { padding: 40px 40px 0; } }

  .bulbs { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 18px; }
  .bulb {
    width: 6px; height: 6px; border-radius: 50%; display: inline-block; opacity: .8;
  }
  @media (prefers-reduced-motion: no-preference) {
    .bulb { animation: bulbPulse 2.4s ease-in-out infinite; }
  }
  @keyframes bulbPulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }

  .header-row { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .logo-img {
    width: 54px; height: 54px; border-radius: 14px; object-fit: cover; flex-shrink: 0;
    box-shadow: 0 0 16px rgba(255,90,200,.5), 0 0 30px rgba(70,200,255,.3);
  }
  @media (min-width: 640px) { .logo-img { width: 76px; height: 76px; border-radius: 18px; } }

  .site-header h1 {
    font-family: 'Audiowide', 'Anton', sans-serif;
    font-size: 1.9rem;
    letter-spacing: .01em;
    background: linear-gradient(180deg, #ffffff 0%, #9be8ff 32%, #ff6fd8 62%, #ffb454 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 16px rgba(255,111,216,.35), 0 0 30px rgba(78,205,255,.25);
  }
  @media (min-width: 640px) { .site-header h1 { font-size: 2.7rem; } }
  .subtitle { color: var(--muted); font-size: .9rem; margin-top: 6px; }

  main { max-width: 1180px; margin: 0 auto; padding: 32px 20px 80px; }
  @media (min-width: 640px) { main { padding: 32px 40px 80px; } }

  .btn-primary {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--amber); color: var(--amber-ink);
    border: none; border-radius: 10px; padding: 13px 22px; font-weight: 700; font-size: .95rem;
  }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-block { width: 100%; justify-content: center; margin-top: 8px; }

  .btn-secondary {
    background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 16px; font-weight: 600;
  }
  .btn-danger { background: var(--coral); color: #1A0800; border: none; border-radius: 8px; padding: 8px 14px; font-weight: 700; }
  .btn-text { background: none; border: none; color: var(--muted); text-decoration: underline; padding: 6px; }
  .icon-btn { background: none; border: none; color: var(--muted); padding: 6px; border-radius: 6px; line-height: 0; }
  .icon-btn:hover { color: var(--text); }

  /* Stats */
  .stats-grid { display: grid; grid-template-columns: 1fr; gap: 14px; margin-top: 28px; list-style: none; padding: 0; }
  @media (min-width: 640px) { .stats-grid { grid-template-columns: repeat(3, 1fr); } }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px; display: flex; align-items: center; gap: 12px;
  }
  .stat-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .stat-value { font-family: 'Anton', sans-serif; font-size: 1.7rem; line-height: 1; }
  .stat-label { font-size: .72rem; color: var(--muted); margin-top: 4px; font-family: 'Space Mono', monospace; }

  /* Filters */
  .filters { display: flex; gap: 8px; margin-top: 30px; flex-wrap: wrap; }
  .filter-btn {
    background: var(--surface); color: var(--muted); border: 1px solid var(--border);
    border-radius: 999px; padding: 9px 18px; font-size: .85rem; font-family: 'Space Mono', monospace;
  }
  .filter-btn[aria-pressed="true"] { background: var(--amber); color: var(--amber-ink); border-color: var(--amber); font-weight: 700; }

  #loadingMsg, .empty-state { color: var(--muted); font-family: 'Space Mono', monospace; font-size: .9rem; }
  .empty-state {
    margin-top: 24px; border: 2px dashed var(--border); border-radius: 14px; padding: 44px 20px; text-align: center;
  }
  .empty-state p { margin: 0 0 16px; }

  /* Event grid */
  .event-grid { list-style: none; padding: 0; margin: 24px 0 0; display: grid; grid-template-columns: 1fr; gap: 22px; }
  @media (min-width: 640px) { .event-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 1000px) { .event-grid { grid-template-columns: repeat(3, 1fr); } }

  .ticket-card {
    width: 100%; text-align: left; display: flex; background: var(--surface);
    border: 1px solid var(--border); border-radius: 14px; overflow: hidden; padding: 0; color: var(--text);
    transition: transform .15s ease, border-color .15s ease;
  }
  .ticket-card:hover { transform: translateY(-3px); border-color: var(--cat-color, var(--amber)); }

  .ticket-stub {
    min-width: 78px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 16px 8px; border-right: 2px dashed var(--cat-color, var(--amber));
    background: color-mix(in srgb, var(--cat-color, var(--amber)) 16%, transparent);
    position: relative;
  }
  .ticket-stub .weekday, .ticket-stub .month { font-size: .62rem; letter-spacing: .08em; color: var(--cat-color, var(--amber)); font-family: 'Space Mono', monospace; }
  .ticket-stub .day { font-family: 'Anton', sans-serif; font-size: 2rem; line-height: 1; margin: 4px 0; }
  .notch { position: absolute; width: 16px; height: 16px; border-radius: 50%; background: var(--bg); right: -8px; }
  .notch.top { top: -8px; } .notch.bottom { bottom: -8px; }

  .ticket-main { flex: 1; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
  .cat-pill {
    display: inline-block; font-size: .62rem; font-family: 'Space Mono', monospace; letter-spacing: .04em;
    padding: 3px 9px; border-radius: 999px; margin-bottom: 8px;
    background: color-mix(in srgb, var(--cat-color, var(--amber)) 22%, transparent); color: var(--cat-color, var(--amber));
  }
  .ticket-main h3 { font-size: 1.25rem; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta-row { display: flex; align-items: center; gap: 6px; font-size: .78rem; color: var(--muted); margin-top: 6px; }
  .ticket-footer {
    display: flex; align-items: center; justify-content: space-between; margin-top: 14px; padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .counts { display: flex; gap: 14px; font-size: .75rem; color: var(--muted); font-family: 'Space Mono', monospace; }
  .counts span { display: inline-flex; align-items: center; gap: 4px; }

  /* Dialogs */
  .dialog-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 50;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .dialog-overlay.side { justify-content: flex-end; padding: 0; }
  .dialog-overlay[hidden] { display: none; }

  .dialog {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    max-width: 460px; width: 100%; padding: 26px; max-height: 90vh; overflow-y: auto;
  }
  .dialog-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 18px; }
  .dialog-header h2 { font-size: 1.7rem; }

  .detail-panel {
    background: var(--surface); border-left: 1px solid var(--border);
    width: 100%; max-width: 460px; height: 100%; overflow-y: auto;
  }
  .detail-top { padding: 22px 22px 0; position: sticky; top: 0; background: var(--surface); z-index: 2; }
  .detail-top h2 { font-size: 1.9rem; margin-top: 4px; }
  .detail-date { color: var(--muted); font-family: 'Space Mono', monospace; font-size: .82rem; margin-top: 6px; }
  .detail-body { padding: 20px 22px 40px; }

  label { display: block; font-size: .72rem; font-family: 'Space Mono', monospace; color: var(--muted); margin: 14px 0 6px; }
  label:first-of-type { margin-top: 0; }
  input[type="text"], input[type="date"], input[type="time"], input[type="number"], textarea {
    width: 100%; padding: 11px 12px; border-radius: 10px; background: var(--surface-2);
    border: 1px solid var(--border); color: var(--text); outline: none;
  }
  input:focus, textarea:focus { border-color: var(--amber); }
  textarea { resize: vertical; min-height: 90px; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  fieldset { border: none; padding: 0; margin: 14px 0 0; }
  legend { font-size: .72rem; font-family: 'Space Mono', monospace; color: var(--muted); padding: 0; margin-bottom: 8px; }

  .category-options { display: flex; flex-wrap: wrap; gap: 8px; }
  .cat-radio { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .cat-label {
    display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 999px;
    background: var(--surface-2); border: 1px solid var(--border); color: var(--muted);
    font-size: .8rem; font-family: 'Space Mono', monospace;
  }
  .cat-label .dot { width: 9px; height: 9px; border-radius: 50%; }
  .cat-radio:checked + .cat-label { color: var(--cat-color); border-color: var(--cat-color); background: color-mix(in srgb, var(--cat-color) 20%, transparent); font-weight: 700; }
  .cat-radio:focus-visible + .cat-label { outline: 3px solid var(--amber); outline-offset: 2px; }

  /* Tabs */
  .tablist { display: flex; gap: 4px; margin-top: 20px; border-bottom: 1px solid var(--border); }
  .tab {
    background: none; border: none; color: var(--muted); font-family: 'Space Mono', monospace;
    font-size: .78rem; padding: 10px 12px; border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--tab-color, var(--amber)); font-weight: 700; }

  .list-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 8px;
  }
  .list-row .item-label { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
  .list-row label { margin: 0; font-family: 'Work Sans', sans-serif; font-size: .95rem; color: var(--text); font-weight: 500; cursor: pointer; }
  input[type="checkbox"] { width: 19px; height: 19px; accent-color: var(--teal); flex-shrink: 0; }
  .qty-badge { font-family: 'Space Mono', monospace; font-size: .7rem; color: var(--muted); background: var(--surface); padding: 2px 7px; border-radius: 6px; }
  .inline-form { display: flex; gap: 8px; margin-bottom: 18px; }
  .inline-form input[type="text"] { flex: 1; }
  .inline-form input[type="number"] { width: 66px; text-align: center; }
  .empty-list { color: var(--muted); font-family: 'Space Mono', monospace; font-size: .85rem; text-align: center; padding: 28px 0; }

  .delete-zone { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--border); }
  .confirm-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .confirm-row span { font-family: 'Space Mono', monospace; font-size: .85rem; color: var(--muted); }
</style>
</head>

        <div>
          <label for="fDate">Data</label>
          <input type="date" id="fDate" name="date" required aria-required="true" />
        </div>
        <div>
          <label for="fTime">Horário</label>
          <input type="time" id="fTime" name="time" />
        </div>
      </div>

      <label for="fLocation">Local</label>
      <input type="text" id="fLocation" name="location" placeholder="Ex: Sede do clube" />

      <fieldset>
        <legend>Categoria</legend>
        <div class="category-options" id="addCategoryOptions"></div>
      </fieldset>

      <button type="submit" class="btn-primary btn-block">Adicionar à agenda</button>
    </form>
  </div>
</div>

<!-- Detail Dialog -->
<div class="dialog-overlay side" id="detailOverlay" hidden>
  <div class="detail-panel" role="dialog" aria-modal="true" aria-labelledby="detailTitle" id="detailDialog">
    <div class="detail-top">
      <div class="dialog-header" style="margin-bottom:0;">
        <span class="cat-pill" id="detailCatPill"></span>
        <button type="button" class="icon-btn" id="btnCloseDetail" aria-label="Fechar detalhes do evento">✕</button>
      </div>
      <h2 id="detailTitle"></h2>
      <p class="detail-date" id="detailDate"></p>

      <div class="tablist" role="tablist" aria-label="Seções do evento">
        <button type="button" class="tab" role="tab" id="tab-geral" aria-controls="panel-geral" aria-selected="true" tabindex="0" data-tab="geral">Visão geral</button>
        <button type="button" class="tab" role="tab" id="tab-pessoas" aria-controls="panel-pessoas" aria-selected="false" tabindex="-1" data-tab="pessoas">Convidados</button>
        <button type="button" class="tab" role="tab" id="tab-equipamento" aria-controls="panel-equipamento" aria-selected="false" tabindex="-1" data-tab="equipamento">Equipamento</button>
      </div>
    </div>

    <div class="detail-body">
      <div role="tabpanel" id="panel-geral" aria-labelledby="tab-geral" tabindex="0"></div>
      <div role="tabpanel" id="panel-pessoas" aria-labelledby="tab-pessoas" tabindex="0" hidden></div>
      <div role="tabpanel" id="panel-equipamento" aria-labelledby="tab-equipamento" tabindex="0" hidden></div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var CATEGORIES = [
    { id: "show", label: "Torneio", color: "#F2B705" },
    { id: "festa", label: "Festa", color: "#FF7A57" },
    { id: "corporativo", label: "Reunião", color: "#5FD1BC" },
    { id: "casamento", label: "Encontro", color: "#D79BFF" },
    { id: "outro", label: "Outro", color: "#ACB0BC" }
  ];
  var MONTHS = ["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];
  var WEEKDAYS = ["DOM","SEG","TER","QUA","QUI","SEX","SÁB"];
  var STORAGE_KEY = "eventos";

  var events = [];
  var loaded = false;
  var filter = "todos";
  var selectedId = null;
  var activeTab = "geral";
  var confirmDeleteOpen = false;
  var lastTrigger = null;

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function catOf(id) { for (var i = 0; i < CATEGORIES.length; i++) if (CATEGORIES[i].id === id) return CATEGORIES[i]; return CATEGORIES[4]; }
  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function parseDateParts(dateStr) {
    if (!dateStr) return { day: "--", month: "---", weekday: "---", dateObj: null };
    var d = new Date(dateStr + "T00:00:00");
    if (isNaN(d.getTime())) return { day: "--", month: "---", weekday: "---", dateObj: null };
    return {
      day: String(d.getDate()).padStart(2, "0"),
      month: MONTHS[d.getMonth()],
      weekday: WEEKDAYS[d.getDay()],
      dateObj: d
    };
  }
  function formatDateLong(dateStr) {
    var p = parseDateParts(dateStr);
    if (!p.dateObj) return "Sem data definida";
    return p.weekday + ", " + p.day + " " + p.month + " " + p.dateObj.getFullYear();
  }
  function announce(msg) {
    var t = document.getElementById("toast");
    t.textContent = "";
    setTimeout(function () { t.textContent = msg; }, 30);
  }

  // ---------- Persistence ----------
  function loadEvents() {
    if (!window.storage) { loaded = true; render(); return; }
    window.storage.get(STORAGE_KEY, false).then(function (res) {
      if (res && res.value) {
        try {
          var parsed = JSON.parse(res.value);
          if (Array.isArray(parsed)) events = parsed;
        } catch (e) {}
      }
    }).catch(function () {}).finally(function () {
      loaded = true;
      render();
    });
  }
  function saveEvents() {
    if (!loaded || !window.storage) return;
    window.storage.set(STORAGE_KEY, JSON.stringify(events), false).catch(function (e) {
      console.error("Falha ao salvar agenda:", e);
    });
  }

  // ---------- Bulbs (decorative) ----------
  (function initBulbs() {
    var wrap = document.getElementById("bulbs");
    var colors = ["#F2B705", "#FF7A57", "#5FD1BC", "#D79BFF"];
    for (var i = 0; i < 24; i++) {
      var s = document.createElement("span");
      s.className = "bulb";
      s.style.background = colors[i % 4];
      s.style.animationDelay = (i * 0.09) + "s";
      wrap.appendChild(s);
    }
  })();

  // ---------- Category radio builders ----------
  function buildCategoryOptions(container, groupName, selectedCat) {
    container.innerHTML = "";
    CATEGORIES.forEach(function (c, idx) {
      var id = groupName + "-" + c.id;
      var input = document.createElement("input");
      input.type = "radio";
      input.name = groupName;
      input.id = id;
      input.value = c.id;
      input.className = "cat-radio";
      if (c.id === (selectedCat || "show")) input.checked = true;
      var label = document.createElement("label");
      label.setAttribute("for", id);
      label.className = "cat-label";
      label.style.setProperty("--cat-color", c.color);
      label.innerHTML = '<span class="dot" style="background:' + c.color + '"></span>' + escapeHtml(c.label);
      container.appendChild(input);
      container.appendChild(label);
    });
  }

  // ---------- Stats ----------
  function renderStats() {
    var today = new Date(); today.setHours(0, 0, 0, 0);
    function isUpcoming(ev) {
      if (!ev.date) return true;
      return new Date(ev.date + "T00:00:00") >= today;
    }
    var upcoming = events.filter(isUpcoming).length;
    var thisMonth = events.filter(function (e) {
      if (!e.date) return false;
      var d = new Date(e.date + "T00:00:00");
      return d.getMonth() === today.getMonth() && d.getFullYear() === today.getFullYear();
    }).length;
    var pendingGear = events.filter(isUpcoming).reduce(function (sum, e) {
      return sum + (e.equipment || []).filter(function (it) { return !it.packed; }).length;
    }, 0);

    var stats = document.getElementById("stats");
    stats.innerHTML =
      statCard("#F2B705", upcoming, "Próximos eventos", '<path d="M4 5h16M8 3v4M16 3v4M4 9h16v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V9Z" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>') +
      statCard("#5FD1BC", thisMonth, "Eventos este mês", '<circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2" fill="none"/><path d="M12 8v4l3 2" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>') +
      statCard("#FF7A57", pendingGear, "Itens a embalar", '<path d="M3 8l9-5 9 5-9 5-9-5Zm0 0v8l9 5m0-13v13m9-13v8l-9 5" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>');
  }
  function statCard(color, value, label, iconPath) {
    return '<li class="stat-card">' +
      '<span class="stat-icon" style="background:' + color + '22;color:' + color + '" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24">' + iconPath + '</svg></span>' +
      '<span><span class="stat-value">' + value + '</span><br/><span class="stat-label">' + label + '</span></span>' +
      '</li>';
  }

  // ---------- Event grid ----------
  function isUpcomingEv(ev) {
    var today = new Date(); today.setHours(0, 0, 0, 0);
    if (!ev.date) return true;
    return new Date(ev.date + "T00:00:00") >= today;
  }
  function getVisibleEvents() {
    var sorted = events.slice().sort(function (a, b) { return (a.date || "9999").localeCompare(b.date || "9999"); });
    if (filter === "proximos") return sorted.filter(isUpcomingEv);
    if (filter === "passados") return sorted.filter(function (e) { return !isUpcomingEv(e); }).reverse();
    return sorted;
  }

  function renderGrid() {
    var grid = document.getElementById("eventGrid");
    var empty = document.getElementById("emptyState");
    var loadingMsg = document.getElementById("loadingMsg");
    loadingMsg.hidden = true;

    var visible = getVisibleEvents();
    if (visible.length === 0) {
      grid.hidden = true;
      empty.hidden = false;
      var msg = filter === "passados" ? "Nenhum evento passado por aqui."
        : filter === "proximos" ? "Nenhum evento próximo agendado."
        : "Sua agenda está vazia por enquanto.";
      empty.innerHTML = '<p>' + msg + '</p><button type="button" class="btn-primary" id="btnEmptyAdd">＋ Criar primeiro evento</button>';
      document.getElementById("btnEmptyAdd").addEventListener("click", function (e) { openAddDialog(e.currentTarget); });
      return;
    }
    empty.hidden = true;
    grid.hidden = false;
    grid.innerHTML = visible.map(cardHtml).join("");

    Array.prototype.forEach.call(grid.querySelectorAll(".ticket-card"), function (btn) {
      btn.addEventListener("click", function () { openDetail(btn.getAttribute("data-id"), btn); });
    });
  }

  function cardHtml(ev) {
    var cat = catOf(ev.category);
    var d = parseDateParts(ev.date);
    var people = ev.people || [], gear = ev.equipment || [];
    var confirmed = people.filter(function (p) { return p.confirmed; }).length;
    var packed = gear.filter(function (i) { return i.packed; }).length;
    var label = "Abrir detalhes de " + (ev.title || "evento sem nome") + ", " + formatDateLong(ev.date);

    return '<li>' +
      '<button type="button" class="ticket-card" style="--cat-color:' + cat.color + '" data-id="' + ev.id + '" aria-label="' + escapeHtml(label) + '">' +
        '<span class="ticket-stub">' +
          '<span class="weekday">' + d.weekday + '</span>' +
          '<span class="day">' + d.day + '</span>' +
          '<span class="month">' + d.month + '</span>' +
          '<span class="notch top" aria-hidden="true"></span><span class="notch bottom" aria-hidden="true"></span>' +
        '</span>' +
        '<span class="ticket-main">' +
          '<span>' +
            '<span class="cat-pill">' + escapeHtml(cat.label.toUpperCase()) + '</span>' +
            '<h3>' + escapeHtml(ev.title || "Evento sem nome") + '</h3>' +
            '<span class="meta-row" aria-hidden="true">📍 ' + escapeHtml(ev.location || "Local a definir") + '</span>' +
            (ev.time ? '<span class="meta-row" aria-hidden="true">🕒 ' + escapeHtml(ev.time) + '</span>' : '') +
          '</span>' +
          '<span class="ticket-footer" aria-hidden="true">' +
            '<span class="counts"><span>👥 ' + confirmed + '/' + people.length + '</span><span>📦 ' + packed + '/' + gear.length + '</span></span>' +
            '<span style="color:' + cat.color + '">›</span>' +
          '</span>' +
        '</span>' +
      '</button>' +
    '</li>';
  }

  // ---------- Filters ----------
  Array.prototype.forEach.call(document.querySelectorAll(".filter-btn"), function (btn) {
    btn.addEventListener("click", function () {
      filter = btn.getAttribute("data-filter");
      Array.prototype.forEach.call(document.querySelectorAll(".filter-btn"), function (b) {
        b.setAttribute("aria-pressed", b === btn ? "true" : "false");
      });
      renderGrid();
    });
  });

  // ---------- Focus trap helper ----------
  function trapFocus(container, onEscape) {
    var focusables = container.querySelectorAll('a[href], button:not([disabled]), input, select, textarea, [tabindex]:not([tabindex="-1"])');
    if (focusables.length === 0) return function () {};
    var first = focusables[0], last = focusables[focusables.length - 1];
    function handler(e) {
      if (e.key === "Escape") { onEscape(); return; }
      if (e.key !== "Tab") return;
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
    container.addEventListener("keydown", handler);
    return function () { container.removeEventListener("keydown", handler); };
  }

  // ---------- Add Event Dialog ----------
  var addOverlay = document.getElementById("addOverlay");
  var addDialog = document.getElementById("addDialog");
  var addForm = document.getElementById("addForm");
  var removeAddTrap = null;

  function openAddDialog(triggerEl) {
    lastTrigger = triggerEl;
    addForm.reset();
    buildCategoryOptions(document.getElementById("addCategoryOptions"), "category", "show");
    addOverlay.hidden = false;
    removeAddTrap = trapFocus(addDialog, closeAddDialog);
    document.getElementById("fTitle").focus();
    document.addEventListener("keydown", escGuardAdd);
  }
  function escGuardAdd(e) { if (e.key === "Escape") closeAddDialog(); }
  function closeAddDialog() {
    addOverlay.hidden = true;
    if (removeAddTrap) removeAddTrap();
    document.removeEventListener("keydown", escGuardAdd);
    if (lastTrigger) lastTrigger.focus();
  }
  document.getElementById("btnNewEvent").addEventListener("click", function (e) { openAddDialog(e.currentTarget); });
  document.getElementById("btnCloseAdd").addEventListener("click", closeAddDialog);
  addOverlay.addEventListener("click", function (e) { if (e.target === addOverlay) closeAddDialog(); });

  addForm.addEventListener("submit", function (e) {
    e.preventDefault();
    var title = document.getElementById("fTitle").value.trim();
    var date = document.getElementById("fDate").value;
    if (!title || !date) {
      announce("Preencha o nome e a data do evento.");
      if (!title) document.getElementById("fTitle").focus(); else document.getElementById("fDate").focus();
      return;
    }
    var catInput = addForm.querySelector('input[name="category"]:checked');
    var ev = {
      id: uid(),
      title: title,
      date: date,
      time: document.getElementById("fTime").value,
      location: document.getElementById("fLocation").value.trim(),
      category: catInput ? catInput.value : "show",
      notes: "",
      people: [],
      equipment: []
    };
    events.push(ev);
    saveEvents();
    closeAddDialog();
    announce("Evento " + title + " adicionado à agenda.");
    render();
    setTimeout(function () { openDetail(ev.id, document.getElementById("btnNewEvent")); }, 50);
  });

  // ---------- Detail Dialog ----------
  var detailOverlay = document.getElementById("detailOverlay");
  var detailDialog = document.getElementById("detailDialog");
  var removeDetailTrap = null;

  function openDetail(id, triggerEl) {
    selectedId = id;
    activeTab = "geral";
    confirmDeleteOpen = false;
    lastTrigger = triggerEl;
    renderDetail();
    detailOverlay.hidden = false;
    removeDetailTrap = trapFocus(detailDialog, closeDetail);
    document.getElementById("btnCloseDetail").focus();
    document.addEventListener("keydown", escGuardDetail);
  }
  function escGuardDetail(e) { if (e.key === "Escape") closeDetail(); }
  function closeDetail() {
    detailOverlay.hidden = true;
    selectedId = null;
    if (removeDetailTrap) removeDetailTrap();
    document.removeEventListener("keydown", escGuardDetail);
    if (lastTrigger) lastTrigger.focus();
  }
  document.getElementById("btnCloseDetail").addEventListener("click", closeDetail);
  detailOverlay.addEventListener("click", function (e) { if (e.target === detailOverlay) closeDetail(); });

  function getSelected() {
    for (var i = 0; i < events.length; i++) if (events[i].id === selectedId) return events[i];
    return null;
  }
  function updateSelected(patch) {
    var ev = getSelected();
    if (!ev) return;
    Object.assign(ev, patch);
    saveEvents();
    renderCardsAndStats();
  }
  function renderCardsAndStats() { renderStats(); renderGrid(); }

  // Tabs
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
  tabs.forEach(function (tab, i) {
    tab.addEventListener("click", function () { selectTab(tab.getAttribute("data-tab")); });
    tab.addEventListener("keydown", function (e) {
      if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
      e.preventDefault();
      var next = e.key === "ArrowRight" ? (i + 1) % tabs.length : (i - 1 + tabs.length) % tabs.length;
      selectTab(tabs[next].getAttribute("data-tab"));
      tabs[next].focus();
    });
  });
  function selectTab(name) {
    activeTab = name;
    tabs.forEach(function (t) {
      var isActive = t.getAttribute("data-tab") === name;
      t.setAttribute("aria-selected", isActive ? "true" : "false");
      t.tabIndex = isActive ? 0 : -1;
    });
    ["geral", "pessoas", "equipamento"].forEach(function (n) {
      document.getElementById("panel-" + n).hidden = n !== name;
    });
    renderPanels();
  }

  function renderDetail() {
    var ev = getSelected();
    if (!ev) return;
    var cat = catOf(ev.category);
    document.getElementById("detailCatPill").textContent = cat.label.toUpperCase();
    document.getElementById("detailCatPill").style.color = cat.color;
    document.getElementById("detailCatPill").style.background = cat.color + "22";
    document.getElementById("detailTitle").textContent = ev.title || "Evento sem nome";
    document.getElementById("detailDate").textContent = formatDateLong(ev.date) + (ev.time ? " · " + ev.time : "");
    tabs.forEach(function (t) { t.style.setProperty("--tab-color", cat.color); });
    selectTab("geral");
  }

  function renderPanels() {
    var ev = getSelected();
    if (!ev) return;
    var cat = catOf(ev.category);
    if (activeTab === "geral") renderGeralPanel(ev, cat);
    if (activeTab === "pessoas") renderPessoasPanel(ev);
    if (activeTab === "equipamento") renderEquipamentoPanel(ev);
    var tabPeople = document.getElementById("tab-pessoas");
    var tabGear = document.getElementById("tab-equipamento");
    var confirmed = (ev.people || []).filter(function (p) { return p.confirmed; }).length;
    var packed = (ev.equipment || []).filter(function (i) { return i.packed; }).length;
    tabPeople.textContent = "Convidados (" + confirmed + "/" + ev.people.length + ")";
    tabGear.textContent = "Equipamento (" + packed + "/" + ev.equipment.length + ")";
  }

  function renderGeralPanel(ev, cat) {
    var panel = document.getElementById("panel-geral");
    panel.innerHTML =
      '<label for="eTitle">Nome do evento</label>' +
      '<input type="text" id="eTitle" value="' + escapeHtml(ev.title) + '" />' +
      '<div class="two-col">' +
        '<div><label for="eDate">Data</label><input type="date" id="eDate" value="' + escapeHtml(ev.date) + '" /></div>' +
        '<div><label for="eTime">Horário</label><input type="time" id="eTime" value="' + escapeHtml(ev.time) + '" /></div>' +
      '</div>' +
      '<label for="eLocation">Local</label>' +
      '<input type="text" id="eLocation" value="' + escapeHtml(ev.location) + '" />' +
      '<fieldset><legend>Categoria</legend><div class="category-options" id="editCategoryOptions"></div></fieldset>' +
      '<label for="eNotes">Notas</label>' +
      '<textarea id="eNotes">' + escapeHtml(ev.notes) + '</textarea>' +
      '<div class="delete-zone" id="deleteZone"></div>';

    buildCategoryOptions(document.getElementById("editCategoryOptions"), "editCategory", ev.category);

    document.getElementById("eTitle").addEventListener("change", function (e) { updateSelected({ title: e.target.value }); renderDetailHeaderOnly(); });
    document.getElementById("eDate").addEventListener("change", function (e) { updateSelected({ date: e.target.value }); renderDetailHeaderOnly(); });
    document.getElementById("eTime").addEventListener("change", function (e) { updateSelected({ time: e.target.value }); renderDetailHeaderOnly(); });
    document.getElementById("eLocation").addEventListener("change", function (e) { updateSelected({ location: e.target.value }); });
    document.getElementById("eNotes").addEventListener("change", function (e) { updateSelected({ notes: e.target.value }); });
    Array.prototype.forEach.call(document.querySelectorAll('input[name="editCategory"]'), function (r) {
      r.addEventListener("change", function () { updateSelected({ category: r.value }); renderDetailHeaderOnly(); });
    });

    renderDeleteZone();
  }

  function renderDetailHeaderOnly() {
    var ev = getSelected();
    if (!ev) return;
    var cat = catOf(ev.category);
    document.getElementById("detailCatPill").textContent = cat.label.toUpperCase();
    document.getElementById("detailCatPill").style.color = cat.color;
    document.getElementById("detailCatPill").style.background = cat.color + "22";
    document.getElementById("detailTitle").textContent = ev.title || "Evento sem nome";
    document.getElementById("detailDate").textContent = formatDateLong(ev.date) + (ev.time ? " · " + ev.time : "");
    tabs.forEach(function (t) { t.style.setProperty("--tab-color", cat.color); });
  }

  function renderDeleteZone() {
    var zone = document.getElementById("deleteZone");
    if (!zone) return;
    if (!confirmDeleteOpen) {
      zone.innerHTML = '<button type="button" class="btn-text" id="btnAskDelete">🗑 Excluir evento</button>';
      document.getElementById("btnAskDelete").addEventListener("click", function () {
        confirmDeleteOpen = true;
        renderDeleteZone();
        document.getElementById("btnConfirmDelete").focus();
      });
    } else {
      zone.innerHTML =
        '<div class="confirm-row">' +
          '<span>Tem certeza?</span>' +
          '<button type="button" class="btn-danger" id="btnConfirmDelete">Sim, excluir</button>' +
          '<button type="button" class="btn-text" id="btnCancelDelete">Cancelar</button>' +
        '</div>';
      document.getElementById("btnConfirmDelete").addEventListener("click", function () {
        var ev = getSelected();
        events = events.filter(function (e) { return e.id !== selectedId; });
        saveEvents();
        announce("Evento " + (ev ? ev.title : "") + " excluído.");
        closeDetail();
        render();
      });
      document.getElementById("btnCancelDelete").addEventListener("click", function () {
        confirmDeleteOpen = false;
        renderDeleteZone();
        document.getElementById("btnAskDelete").focus();
      });
    }
  }

  function renderPessoasPanel(ev) {
    var panel = document.getElementById("panel-pessoas");
    var listHtml = ev.people.length === 0
      ? '<p class="empty-list">Ninguém na lista ainda.</p>'
      : ev.people.map(function (p) {
          var id = "person-" + p.id;
          return '<div class="list-row">' +
            '<span class="item-label">' +
              '<input type="checkbox" id="' + id + '" ' + (p.confirmed ? "checked" : "") + ' data-person-id="' + p.id + '" />' +
              '<label for="' + id + '">' + escapeHtml(p.name) + (p.confirmed ? ' <span class="sr-only">(confirmado)</span>' : ' <span class="sr-only">(não confirmado)</span>') + '</label>' +
            '</span>' +
            '<button type="button" class="icon-btn" data-remove-person="' + p.id + '" aria-label="Remover ' + escapeHtml(p.name) + '">🗑</button>' +
          '</div>';
        }).join("");

    panel.innerHTML =
      '<form id="addPersonForm" class="inline-form">' +
        '<label for="newPersonName" class="sr-only">Nome do convidado</label>' +
        '<input type="text" id="newPersonName" placeholder="Nome do convidado" />' +
        '<button type="submit" class="btn-primary" aria-label="Adicionar convidado">＋</button>' +
      '</form>' +
      '<div id="peopleList">' + listHtml + '</div>';

    document.getElementById("addPersonForm").addEventListener("submit", function (e) {
      e.preventDefault();
      var input = document.getElementById("newPersonName");
      var name = input.value.trim();
      if (!name) return;
      ev.people.push({ id: uid(), name: name, confirmed: false });
      saveEvents();
      announce(name + " adicionado à lista de convidados.");
      renderPanels();
      renderCardsAndStats();
      document.getElementById("newPersonName").focus();
    });
    Array.prototype.forEach.call(panel.querySelectorAll("[data-person-id]"), function (cb) {
      cb.addEventListener("change", function () {
        var p = ev.people.find(function (p) { return p.id === cb.getAttribute("data-person-id"); });
        if (p) p.confirmed = cb.checked;
        saveEvents();
        renderPanels();
        renderCardsAndStats();
      });
    });
    Array.prototype.forEach.call(panel.querySelectorAll("[data-remove-person]"), function (btn) {
      btn.addEventListener("click", function () {
        var pid = btn.getAttribute("data-remove-person");
        ev.people = ev.people.filter(function (p) { return p.id !== pid; });
        saveEvents();
        renderPanels();
        renderCardsAndStats();
      });
    });
  }

  function renderEquipamentoPanel(ev) {
    var panel = document.getElementById("panel-equipamento");
    var listHtml = ev.equipment.length === 0
      ? '<p class="empty-list">Nenhum equipamento adicionado.</p>'
      : ev.equipment.map(function (it) {
          var id = "gear-" + it.id;
          return '<div class="list-row">' +
            '<span class="item-label">' +
              '<input type="checkbox" id="' + id + '" ' + (it.packed ? "checked" : "") + ' data-gear-id="' + it.id + '" />' +
              '<label for="' + id + '">' + escapeHtml(it.name) + ' <span class="qty-badge">x' + it.qty + '</span>' + (it.packed ? ' <span class="sr-only">(embalado)</span>' : ' <span class="sr-only">(não embalado)</span>') + '</label>' +
            '</span>' +
            '<button type="button" class="icon-btn" data-remove-gear="' + it.id + '" aria-label="Remover ' + escapeHtml(it.name) + '">🗑</button>' +
          '</div>';
        }).join("");

    panel.innerHTML =
      '<form id="addGearForm" class="inline-form">' +
        '<label for="newGearName" class="sr-only">Nome do equipamento</label>' +
        '<input type="text" id="newGearName" placeholder="Item de equipamento" />' +
        '<label for="newGearQty" class="sr-only">Quantidade</label>' +
        '<input type="number" id="newGearQty" min="1" value="1" />' +
        '<button type="submit" class="btn-primary" aria-label="Adicionar equipamento">＋</button>' +
      '</form>' +
      '<div id="gearList">' + listHtml + '</div>';

    document.getElementById("addGearForm").addEventListener("submit", function (e) {
      e.preventDefault();
      var nameInput = document.getElementById("newGearName");
      var qtyInput = document.getElementById("newGearQty");
      var name = nameInput.value.trim();
      if (!name) return;
      ev.equipment.push({ id: uid(), name: name, qty: Number(qtyInput.value) || 1, packed: false });
      saveEvents();
      announce(name + " adicionado à lista de equipamento.");
      renderPanels();
      renderCardsAndStats();
      document.getElementById("newGearName").focus();
    });
    Array.prototype.forEach.call(panel.querySelectorAll("[data-gear-id]"), function (cb) {
      cb.addEventListener("change", function () {
        var it = ev.equipment.find(function (i) { return i.id === cb.getAttribute("data-gear-id"); });
        if (it) it.packed = cb.checked;
        saveEvents();
        renderPanels();
        renderCardsAndStats();
      });
    });
    Array.prototype.forEach.call(panel.querySelectorAll("[data-remove-gear]"), function (btn) {
      btn.addEventListener("click", function () {
        var iid = btn.getAttribute("data-remove-gear");
        ev.equipment = ev.equipment.filter(function (i) { return i.id !== iid; });
        saveEvents();
        renderPanels();
        renderCardsAndStats();
      });
    });
  }

  // ---------- Root render ----------
  function render() {
    if (!loaded) return;
    renderStats();
    renderGrid();
  }

  loadEvents();
})();
</script>
</body>
</html>
